<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 64" width="70" height="64" role="img" aria-label="Alcard">
  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- geometric A (matches mark.svg) -->
  <path d="M 24.5 19 L 12 52" fill="none" stroke="url(#tg)" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M 35.5 19 L 48 52" fill="none" stroke="url(#tg)" stroke-width="6.5" stroke-linecap="round"/>
  <line x1="19.5" y1="33.5" x2="40.5" y2="33.5" stroke="url(#tg)" stroke-width="5.5" stroke-linecap="round"/>

  <!-- tap dot + signal arcs radiating from it -->
  <circle cx="30" cy="21.5" r="3.2" fill="url(#tg)"/>
  <path d="M 30 10.5 A 11 11 0 0 1 41 21.5" fill="none" stroke="url(#tg)" stroke-width="2.4" stroke-linecap="round"/>
