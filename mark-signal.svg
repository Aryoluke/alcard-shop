<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 64" width="70" height="64" role="img" aria-label="Alcard">
  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- geometric T -->
  <rect x="1" y="20" width="29" height="7" rx="3.5" fill="url(#tg)"/>
  <rect x="14.25" y="20" width="7" height="30" rx="3.5" fill="url(#tg)"/>

  <!-- tap dot + signal arcs radiating from it -->
  <circle cx="36" cy="23.5" r="4.5" fill="url(#tg)"/>
  <path d="M 36 12.5 A 11 11 0 0 1 47 23.5" fill="none" stroke="url(#tg)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 36 5.5 A 18 18 0 0 1 54 23.5" fill="none" stroke="url(#tg)" stroke-width="2.2" stroke-linecap="round"/>
</svg>
