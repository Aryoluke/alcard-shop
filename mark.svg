<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Tagmi">
  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- deep ink tile with hairline border + top sheen -->
  <rect x="0.5" y="0.5" width="63" height="63" rx="16" fill="#0B1222" stroke="rgba(255,255,255,0.09)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="16" fill="url(#sheen)"/>

  <!-- geometric T: crossbar -->
  <rect x="15" y="20" width="29" height="7" rx="3.5" fill="url(#tg)"/>
  <!-- geometric T: stem -->
  <rect x="28.25" y="20" width="7" height="30" rx="3.5" fill="url(#tg)"/>

  <!-- the separated tap dot — "Tag · Me" -->
  <circle cx="50" cy="23.5" r="4.5" fill="url(#tg)"/>
</svg>
