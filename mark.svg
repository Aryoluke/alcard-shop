<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Alcard">
  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- deep ink tile with hairline border + top sheen (the card) -->
  <rect x="0.5" y="0.5" width="63" height="63" rx="16" fill="#0B1222" stroke="rgba(255,255,255,0.09)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="16" fill="url(#sheen)"/>

  <!-- geometric A: apex-gap legs -->
  <path d="M 26.5 19 L 14 52" fill="none" stroke="url(#tg)" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M 37.5 19 L 50 52" fill="none" stroke="url(#tg)" stroke-width="6.5" stroke-linecap="round"/>

  <!-- crossbar -->
  <line x1="21.5" y1="33.5" x2="42.5" y2="33.5" stroke="url(#tg)" stroke-width="5.5" stroke-linecap="round"/>

  <!-- the tap dot in the apex notch — "this is where you tap" -->
  <circle cx="32" cy="21.5" r="3.2" fill="url(#tg)"/>
</svg>
