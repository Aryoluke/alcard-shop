<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 216 64" width="216" height="64" role="img" aria-label="Alcard">
  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- mark, 48px tile -->
  <g transform="translate(0,8) scale(0.75)">
    <rect x="0.5" y="0.5" width="63" height="63" rx="16" fill="#0B1222" stroke="rgba(255,255,255,0.09)"/>
    <rect x="0.5" y="0.5" width="63" height="63" rx="16" fill="url(#sheen)"/>
    <rect x="15" y="20" width="29" height="7" rx="3.5" fill="url(#tg)"/>
    <rect x="28.25" y="20" width="7" height="30" rx="3.5" fill="url(#tg)"/>
    <circle cx="50" cy="23.5" r="4.5" fill="url(#tg)"/>
  </g>

  <!-- wordmark: tagm + custom i (gradient dot echoes the mark's tap dot) -->
  <text x="62" y="44" font-family="'Inter','Segoe UI',Arial,sans-serif" font-size="40" font-weight="900" fill="#F8FAFC" letter-spacing="-1.2">tagm</text>
  <circle cx="165.5" cy="19.5" r="5" fill="url(#tg)"/>
</svg>
